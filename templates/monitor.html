{% extends "house.html" %}
{% block content %}
<head>
  <title>Monitor Workout | {{ session.get('user_gym_name', 'Admin') }}</title>
</head>
<div class="p-10 h-full font-Helvetica flex flex-col gap-6">
    <div id="header" class="w-full grid grid-cols-2 h-[7%]">
        <h1 class="text-4xl font-semibold">Monitor<p class="text-lg text-gray-400 font-normal leading-[15px]">Live monitoring of users workout</p></h1>
        <div class="flex justify-end items-center gap-2">
          <h1 class="text-xl font-Helvetica font-semibold">{{ session.get('user_gym_name', 'Admin') }}</h1>
        </div>
    </div>
    <div class="grid grid-cols-2 font-Helvetica text-xl">
        <label>
          Camera 1:
          <select class="px-3 rounded-lg border border-gray-400 py-2" id="select-camera-1"></select>
        </label>
        <label>
          Camera 2:
          <select class="px-3 rounded-lg border border-gray-400  py-2" id="select-camera-2"></select>
        </label>
    </div>

    <div class="flex w-full items-center gap-2 ">
      <div class="w-1/2">
        <video class="w-full h-full" id="camera1" controls autoplay playsinline></video>
      </div>
      <div class="w-1/2">
        <video class="w-full h-full" id="camera2" controls autoplay playsinline></video>
      </div>
    </div>
      <div class="flex justify-center  w-full">
        <button id="btn-open-camera" class="flex  gap-3 cursor-pointer text-2xl justify-center w-[15%] bg-[#F05454] hover:bg-[#f77777] transition delay-75 ease-in px-3 py-2 rounded-lg items-center text-white font-Helvetica"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera-icon lucide-camera"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg> Open Cameras</button>
      </div>

      <script>
        var devices;
        var camSelect1 = document.getElementById("select-camera-1");
        var camSelect2 = document.getElementById("select-camera-2");
        window.onload = async function(){
          await listDevices()
        }
  
        async function listDevices(){
          devices = await getCameraDevices()
          for (let index = 0; index < devices.length; index++) {
            const device = devices[index];
            camSelect1.appendChild(new Option(device.label ?? "Camera "+index,device.deviceId));
            camSelect2.appendChild(new Option(device.label ?? "Camera "+index,device.deviceId));
          }
          camSelect2.selectedIndex = 1;
        }
  
        async function getCameraDevices(){
          await askForPermissions();
          var allDevices = await navigator.mediaDevices.enumerateDevices();
          var cameraDevices = [];
          for (var i=0;i<allDevices.length;i++){
            var device = allDevices[i];
            if (device.kind == 'videoinput'){
              cameraDevices.push(device);
            }
          }
          return cameraDevices;
        }
  
        async function askForPermissions(){
          var stream;
          try {
            var constraints = {video: true, audio: false}; //ask for camera permission
            stream = await navigator.mediaDevices.getUserMedia(constraints);  
          } catch (error) {
            console.log(error);
          }
          closeStream(stream);
        }
  
        function closeStream(stream){
          try{
            if (stream){
              stream.getTracks().forEach(track => track.stop());
            }
          } catch (e){
            alert(e.message);
          }
        }
  
        document.getElementById("btn-open-camera").addEventListener("click",function(){
          captureCamera(document.getElementById("camera1"),camSelect1.selectedOptions[0].value);
          captureCamera(document.getElementById("camera2"),camSelect2.selectedOptions[0].value);
        });
  
        function captureCamera(video, selectedCamera) {
          var constraints = {
            audio:false,
            video:true
          }
          if (selectedCamera) {
            constraints = {
              video: {deviceId: selectedCamera},
              audio: false
            }
          }
          navigator.mediaDevices.getUserMedia(constraints).then(function(camera) {
            video.srcObject = camera;
          }).catch(function(error) {
            alert('Unable to capture your camera. Please check console logs.');
            console.error(error);
          });
        }
      </script>
</div>

{% endblock %}
