<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Gym Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/output.css') }}">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center font-Helvetica overflow-hidden">
    <div class="h-[100dvh] w-full relative">
        <div class="w-[100dvw] top-0 absolute z-11 h-[100dvh] bg-black/25 flex items-center justify-end pr-30">
            <div class="w-[90%] max-w-md bg-white p-10 rounded-3xl shadow-xl absolute z-10">
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-bold text-[#2D2C2C]">Reset Your Password</h2>
                    <p class="text-gray-500 text-sm mt-2">Enter your new secure password.</p>
                </div>

                <form method="POST" class="flex flex-col gap-4">
                    {% if error %}
                        <div class="bg-red-100 text-red-700 p-3 rounded-lg text-sm text-center">
                            {{ error }}
                        </div>
                    {% endif %}

                    <div class="flex flex-col gap-2 relative">
                        <label class="font-bold text-lg text-[#2D2C2C]">New Password</label>
                        <input id="pass1" type="password" name="password" placeholder="••••••••" class="border p-2 rounded-lg outline-none pr-10" required>
                        <button type="button" onclick="togglePassword('pass1', this)" class="absolute top-11 right-3 flex items-center">
                            <svg class="eye-icon cursor-pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-slash-icon hidden cursor-pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>

                    <div class="flex flex-col gap-2 relative">
                        <label class="font-bold text-lg text-[#2D2C2C]">Confirm Password</label>
                        <input id="pass2" type="password" name="confirm_password" placeholder="••••••••" class="border p-2 rounded-lg outline-none pr-10" required>
                        <button type="button" onclick="togglePassword('pass2', this)" class="absolute top-11 right-3 flex items-center">
                            <svg class="eye-icon cursor-pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-slash-icon hidden cursor-pointer" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>

                    <button type="submit" class="bg-[#2D2C2C] text-white py-3 mt-4 rounded-4xl font-bold hover:bg-[#474646] transition-all w-full cursor-pointer">
                        Confirm
                    </button>
                </form>
            </div>
        </div>

        <div class="h-full p-3">
            <img class="object-cover h-full w-full rounded-2xl" src="/static/src/images/home.jpg" alt="Background">
            <div class="absolute bottom-5 -left-12 z-10 w-[80%]">
                <h2 class="text-[550px] text-white font-bold font-Helvetica italic -tracking-[50px] leading-110">GYM BUDDY</h2>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const eye = btn.querySelector(".eye-icon");
            const eyeSlash = btn.querySelector(".eye-slash-icon");

            if (input.type === "password") {
                input.type = "text";
                eye.classList.add("hidden");
                eyeSlash.classList.remove("hidden");
            } else {
                input.type = "password";
                eye.classList.remove("hidden");
                eyeSlash.classList.add("hidden");
            }
        }
    </script>
</body>
</html>
