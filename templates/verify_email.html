<!DOCTYPE html>
<html>
<body style="background-color: #f7f7f7; margin: 0; padding: 40px; font-family: 'Helvetica', Arial, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <tr>
            <td align="center" style="padding: 20px; background-color: #2D2C2C; border-radius: 20px 20px 0 0;">
                <div style="display: inline-block; vertical-align: middle;">
                    <img src="https://i.imgur.com/eHltM0r.png" 
                        alt="Gym Buddy Logo" 
                        width="auto" 
                        style="display: block; border: 0; width: auto; height: 100px;">
                </div>

                <div style="display: inline-block; width: 12px; height: 10px;"></div>

                <div style="display: inline-block; vertical-align: middle;">
                    <h1 style="color: #ffffff; margin: 0; font-family: 'Helvetica', Arial, sans-serif; font-size: 26px; font-weight: bold; line-height: 1;">
                        Gym Buddy
                    </h1>
                </div>
            </td>
        </tr>
        <tr>
            <td style="padding: 40px;">
                <h2 style="color: #2D2C2C; margin-top: 0;">Verify Your Account</h2>
                <p style="color: #555555; line-height: 1.6; font-size: 16px;">
                    Welcome to GymBuddy! Start managing your Gym Trainers with AI Pose Tracker. Please confirm your email address.
                </p>
                <div style="text-align: center; margin: 40px 0;">
                    <a href="{{ url }}" style="background-color: #2D2C2C; color: #ffffff; padding: 18px 32px; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 16px;">Verify My Email</a>
                </div>
                <p style="color: #999999; font-size: 12px; text-align: center;">
                    The link will expire in 1 hour. If you didn't sign up for Gym Buddy, ignore this email.
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
