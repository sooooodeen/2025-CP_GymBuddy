{% extends "house.html" %}
{% block title %}Admin Monitor{% endblock %}
{% block content %}
<head>
    <title>Admin Monitor | {{ session.get('user_gym_name', 'Admin') }}</title>
</head>
<div class="p-10 h-full font-Helvetica flex flex-col gap-6">
    <div id="header" class="w-full grid grid-cols-2 h-[7%]">
        <h1 class="text-4xl font-semibold">Admin Monitor<p class="text-lg text-gray-400 font-normal leading-[15px]">Live monitoring of assigned trainers' cameras</p></h1>
        <div class="flex justify-end items-center gap-2">
            <h1 class="text-xl font-Helvetica font-semibold">{{ session.get('user_gym_name', 'Admin') }}</h1>
        </div>
    </div>
    <div class="flex items-center gap-4 bg-white p-4 rounded-lg shadow-md">
        <label class="font-semibold">
            Camera 1:
            <select id="select-camera-1" class="ml-2 p-2 border border-gray-300 rounded-lg"></select>
        </label>
        <label class="font-semibold">
            Camera 2:
            <select id="select-camera-2" class="ml-2 p-2 border border-gray-300 rounded-lg"></select>
        </label>
        <button id="btn-open-camera" class="bg-[#30475E] text-white px-5 py-2 rounded-lg cursor-pointer hover:bg-[#465f77] transition ease-in duration-200">Open Cameras</button>
    </div>
    <div class="flex w-full gap-4 flex-grow">
        <div class="w-1/2 bg-black rounded-lg overflow-hidden shadow-md">
            <video class="w-full h-full object-cover" id="camera1" controls autoplay playsinline></video>
        </div>
        <div class="w-1/2 bg-black rounded-lg overflow-hidden shadow-md">
            <video class="w-full h-full object-cover" id="camera2" controls autoplay playsinline></video>
        </div>
    </div>

    <script>
        var devices;
        var camSelect1 = document.getElementById("select-camera-1");
        var camSelect2 = document.getElementById("select-camera-2");
        
        // Automatically list devices when the page loads
        window.onload = async function(){
            await listDevices();
        };

        async function listDevices(){
            try {
                devices = await getCameraDevices();
                // Clear any existing options
                camSelect1.innerHTML = '';
                camSelect2.innerHTML = '';

                if (devices.length === 0) {
                    camSelect1.appendChild(new Option("No cameras found", ""));
                    camSelect2.appendChild(new Option("No cameras found", ""));
                    return;
                }

                devices.forEach((device, index) => {
                    camSelect1.appendChild(new Option(device.label || `Camera ${index + 1}`, device.deviceId));
                    camSelect2.appendChild(new Option(device.label || `Camera ${index + 1}`, device.deviceId));
                });

                // Set a different default camera for the second dropdown if possible
                if (devices.length > 1) {
                    camSelect2.selectedIndex = 1;
                }
            } catch (error) {
                console.error("Error listing devices:", error);
                alert("Could not list camera devices. Please ensure you have given permission and have cameras connected.");
            }
        }

        async function getCameraDevices(){
            // First, ask for permissions which is required for enumerateDevices to return full info
            await navigator.mediaDevices.getUserMedia({ video: true });
            
            let allDevices = await navigator.mediaDevices.enumerateDevices();
            return allDevices.filter(device => device.kind === 'videoinput');
        }

        document.getElementById("btn-open-camera").addEventListener("click", function(){
            const selectedCamera1 = camSelect1.value;
            const selectedCamera2 = camSelect2.value;

            if (selectedCamera1 === selectedCamera2) {
                alert("Please select two different cameras.");
                return;
            }

            captureCamera(document.getElementById("camera1"), selectedCamera1);
            captureCamera(document.getElementById("camera2"), selectedCamera2);
        });

        function captureCamera(videoElement, deviceId) {
            // Stop any existing stream on the video element
            if (videoElement.srcObject) {
                videoElement.srcObject.getTracks().forEach(track => track.stop());
            }
            
            const constraints = {
                audio: false,
                video: { deviceId: { exact: deviceId } }
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    videoElement.srcObject = stream;
                })
                .catch(function(error) {
                    alert('Unable to capture your camera. Please check console logs.');
                    console.error('getUserMedia error:', error);
                });
        }
    </script>
</div>
{% endblock %}
